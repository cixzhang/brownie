<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Component Docs - Brownie</title>
  <link rel="stylesheet" href="../src/base.css">
  <link rel="stylesheet" href="brownie.css" id="theme-link">
  <style>
    body {
      margin: 0;
      padding: var(--space-6);
      line-height: 1.6;
    }

    .page-layout {
      display: flex;
      gap: var(--space-6);
      max-width: 1100px;
      margin: 0 auto;
    }

    .main-content {
      flex: 1;
      min-width: 0;
      max-width: 800px;
    }

    .toc-sidebar {
      width: 200px;
      flex-shrink: 0;
      display: none;
    }

    @media (min-width: 1000px) {
      .toc-sidebar {
        display: block;
      }
    }

    .toc {
      position: sticky;
      top: var(--space-6);
      max-height: calc(100vh - var(--space-6) * 2);
      overflow-y: auto;
      padding-right: var(--space-2);
    }

    .toc-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-muted);
      margin-bottom: var(--space-2);
    }

    .toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 0.875rem;
    }

    .toc-list li {
      margin-bottom: var(--space-1);
    }

    .toc-list a {
      color: var(--color-text-secondary);
      text-decoration: none;
      display: block;
      padding: var(--space-0_5) 0;
      border-left: 2px solid transparent;
      padding-left: var(--space-2);
      transition: all 150ms;
    }

    .toc-list a:hover {
      color: var(--color-text-primary);
    }

    .toc-list a.active {
      color: var(--color-text-accent);
      border-left-color: var(--color-accent);
    }

    .toc-list .toc-h3 {
      padding-left: var(--space-4);
      font-size: 0.8125rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-4);
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
    }

    .back-link {
      color: var(--color-text-accent);
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .controls {
      display: flex;
      gap: var(--space-2);
      align-items: center;
    }

    h1 { margin-top: 0; }
    h2 { margin-top: var(--space-6); border-bottom: 1px solid var(--color-border); scroll-margin-top: var(--space-4); }
    h3 { margin-top: var(--space-4); scroll-margin-top: var(--space-4); }
    div { margin-bottom: var(--space-2); }

    code {
      background: var(--color-muted);
      padding: var(--space-0_5) var(--space-1);
      border-radius: var(--radius-element);
      font-size: 0.875em;
    }

    pre, pre code {
      background: none;
      padding: 0;
      margin: 0;
    }

    .example-code {
      overflow-x: auto;
      overscroll-behavior-inline: none;
    }

    .error {
      color: var(--color-error-text);
      background: var(--color-error-bg);
      padding: var(--space-4);
      border-radius: var(--radius-element);
    }

    brow-table {
      margin: var(--space-4) 0;
    }

    ul, ol {
      margin: var(--space-3) 0;
      padding-left: var(--space-6);
    }

    li {
      margin-bottom: var(--space-1);
    }

    #content { display: none; }
    #content.loaded { display: block; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-link">&larr; Back to docs</a>
    <div class="controls">
      <brow-select id="theme-select"></brow-select>
      <brow-button variant="ghost" id="theme-toggle" title="Toggle dark mode">
        <span id="theme-icon">☀️</span>
      </brow-button>
    </div>
  </header>

  <div class="page-layout">
    <main class="main-content">
      <div id="content"></div>
      <div id="error" class="error" style="display: none;"></div>
    </main>
    <aside class="toc-sidebar">
      <nav class="toc">
        <div class="toc-title">On this page</div>
        <ul class="toc-list" id="toc-list"></ul>
      </nav>
    </aside>
  </div>

  <script type="module">
    import Brownie from '../src/index.js';

    const params = new URLSearchParams(window.location.search);
    const component = params.get('component');

    if (!component) {
      showError('No component specified. Use ?component=brow-button');
    } else {
      initComponent(component);
    }

    async function initComponent(name) {
      try {
        // Check registry for redirects
        const registryResponse = await fetch('../src/registry.json');
        const registry = await registryResponse.json();
        const componentInfo = registry.components.find(c => c.name === name);

        if (componentInfo?.docs) {
          // Redirect to the parent component's docs
          window.location.replace(`?component=${componentInfo.docs}`);
          return;
        }

        loadComponent(name);
      } catch (err) {
        // If registry check fails, try loading directly
        loadComponent(name);
      }
    }

    async function loadComponent(name) {
      try {
        const response = await fetch(`../src/components/${name}/README.md`);
        if (!response.ok) throw new Error(`Component "${name}" not found`);

        const markdown = await response.text();
        const html = renderMarkdown(markdown);

        document.getElementById('content').innerHTML = html;
        document.getElementById('content').classList.add('loaded');
        document.title = `${name} - Brownie`;

        buildTOC();
        await Brownie.ready();
      } catch (err) {
        showError(err.message);
      }
    }

    function showError(message) {
      document.getElementById('error').textContent = message;
      document.getElementById('error').style.display = 'block';
    }

    function renderMarkdown(md) {
      let html = md;

      // Code blocks with live examples
      html = html.replace(/```html example\n([\s\S]*?)```/g, (_, code) => {
        const escaped = code.trim().replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return /*html*/`
          <brow-card padding="space-0">
            <brow-section padding="space-4">${code.trim()}</brow-section>
            <brow-section variant="muted" padding="space-4" class="example-code">
              <pre><code>${escaped}</code></pre>
            </brow-section>
          </brow-card>`;
      });

      // Regular code blocks
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
        const escaped = code.trim().replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return `<pre><code>${escaped}</code></pre>`;
      });

      // Tables - render as brow-table (before inline code so backticks are preserved)
      html = html.replace(/^(\|.+\|)\n(\|[-:\| ]+\|)\n((?:\|.+\|\n?)+)/gm, (_, headerRow, separatorRow, bodyRows) => {
        const headers = headerRow.split('|').slice(1, -1).map(h => h.trim());
        const rows = bodyRows.trim().split('\n').map(row =>
          row.split('|').slice(1, -1).map(cell => cell.trim())
        );

        // Convert header text to valid data attribute names
        const toDataAttr = (text) => (text || '').toLowerCase().replace(/\s+/g, '-');
        // Escape for HTML attribute (browser will decode when reading)
        const escapeAttr = (text) => text
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
        // Convert backticks to code tags for cell values
        const processCell = (text) => {
          // First escape content inside backticks, then wrap with code tags
          return text.replace(/`([^`]+)`/g, (_, code) => {
            const escaped = code
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/\{/g, '&#123;')
              .replace(/\}/g, '&#125;');
            return `<code>${escaped}</code>`;
          });
        };

        // Build header data attributes
        const headerAttrs = headers.map(h => `data-${toDataAttr(h)}="${escapeAttr(h)}"`).join(' ');

        // Build column templates with raw HTML rendering
        const columnsHtml = headers.map(h =>
          `<brow-table-column field="${toDataAttr(h)}">{{{${toDataAttr(h)}}}}</brow-table-column>`
        ).join('\n  ');

        // Build rows with data attributes (values have backticks converted to code tags)
        const rowsHtml = rows.map(row => {
          const rowAttrs = row
            .map((cell, i) => headers[i] ? `data-${toDataAttr(headers[i])}="${escapeAttr(processCell(cell))}"` : null)
            .filter(Boolean)
            .join(' ');
          return `<brow-table-row ${rowAttrs}></brow-table-row>`;
        }).join('\n  ');

        return `<brow-table>
  <brow-table-header ${headerAttrs}></brow-table-header>
  ${columnsHtml}
  ${rowsHtml}
</brow-table>`;
      });

      // Inline code
      html = html.replace(/`([^`]+)`/g, (_, code) => {
        const escaped = code.trim().replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return `<code>${escaped}</code>`;
      });

      // Unordered lists
      html = html.replace(/^((?:[-*] .+\n?)+)/gm, (match) => {
        const items = match.trim().split('\n').map(line => {
          const content = line.replace(/^[-*] /, '');
          return `<li>${content}</li>`;
        }).join('\n');
        return `<ul>\n${items}\n</ul>`;
      });

      // Ordered lists
      html = html.replace(/^((?:\d+\. .+\n?)+)/gm, (match) => {
        const items = match.trim().split('\n').map(line => {
          const content = line.replace(/^\d+\. /, '');
          return `<li>${content}</li>`;
        }).join('\n');
        return `<ol>\n${items}\n</ol>`;
      });

      // Headers with IDs for TOC
      const toId = (text) => text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      html = html.replace(/^### (.+)$/gm, (_, text) => `<h3 id="${toId(text)}">${text}</h3>`);
      html = html.replace(/^## (.+)$/gm, (_, text) => `<h2 id="${toId(text)}">${text}</h2>`);
      html = html.replace(/^# (.+)$/gm, (_, text) => `<h1 id="${toId(text)}">${text}</h1>`);

      // Paragraphs (simple approach)
      html = html.replace(/\n\n/g, '</div><div>');
      html = '<div>' + html + '</div>';
      html = html.replace(/<div><(h[1-3]|div|pre|brow-|ul|ol)/g, '<$1');
      html = html.replace(/<\/(h[1-3]|div|pre|brow-card|brow-table|ul|ol)><\/div>/g, '</$1>');
      html = html.replace(/<div><\/div>/g, '');

      return html;
    }

    function buildTOC() {
      const content = document.getElementById('content');
      const tocList = document.getElementById('toc-list');
      const headings = content.querySelectorAll('h2, h3');

      if (headings.length === 0) {
        document.querySelector('.toc-sidebar').style.display = 'none';
        return;
      }

      tocList.innerHTML = headings.length > 0
        ? [...headings].map(h => {
            const level = h.tagName.toLowerCase();
            return `<li><a href="#${h.id}" class="toc-${level}">${h.textContent}</a></li>`;
          }).join('')
        : '';

      // Scroll spy for active state
      const tocLinks = tocList.querySelectorAll('a');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            tocLinks.forEach(link => link.classList.remove('active'));
            const activeLink = tocList.querySelector(`a[href="#${entry.target.id}"]`);
            if (activeLink) activeLink.classList.add('active');
          }
        });
      }, { rootMargin: '-20% 0px -70% 0px' });

      headings.forEach(h => observer.observe(h));

      // Smooth scroll on click
      tocLinks.forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const id = link.getAttribute('href').slice(1);
          const target = document.getElementById(id);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            history.pushState(null, '', `#${id}`);
          }
        });
      });
    }

    // Theme switching
    const themeSelect = document.getElementById('theme-select');
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themeLink = document.getElementById('theme-link');

    async function loadThemes() {
      try {
        const response = await fetch('themes.json');
        const data = await response.json();

        themeSelect.innerHTML = data.themes.map(t =>
          `<brow-option value="${t.path}">${t.name}</brow-option>`
        ).join('');

        // Restore saved theme
        const savedTheme = localStorage.getItem('brownie-theme');
        if (savedTheme) {
          themeSelect.value = savedTheme;
          setTheme(savedTheme);
        }
      } catch (err) {
        console.error('Failed to load themes:', err);
      }
    }

    let hasInitializedTheme = false;
    function setTheme(themePath) {
      if (hasInitializedTheme) {
        Brownie.unready();
      }
      themeLink.href = themePath;
      themeLink.addEventListener('load', () => Brownie.ready(), { once: true });
      hasInitializedTheme = true;
    }

    themeSelect.addEventListener('change', (e) => {
      const value = /** @type {HTMLSelectElement} */ (e.target).value;
      setTheme(value);
      localStorage.setItem('brownie-theme', value);
    });

    // Dark mode toggle
    function updateDarkMode() {
      const isDark = document.documentElement.dataset.theme === 'dark';
      themeIcon.textContent = isDark ? '🌙' : '☀️';
    }

    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.dataset.theme === 'dark';
      document.documentElement.dataset.theme = isDark ? 'light' : 'dark';
      localStorage.setItem('brownie-dark-mode', isDark ? 'light' : 'dark');
      updateDarkMode();
    });

    // Restore dark mode preference
    const savedDarkMode = localStorage.getItem('brownie-dark-mode');
    if (savedDarkMode) {
      document.documentElement.dataset.theme = savedDarkMode;
    }
    updateDarkMode();

    // Load themes
    loadThemes();
  </script>
</body>
</html>
