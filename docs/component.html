<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Component Docs - Brownie</title>
  <link rel="stylesheet" href="../src/base.css">
  <link rel="stylesheet" href="brownie.css" id="theme-link">
  <style>
    body {
      font-family: var(--font-body);
      color: var(--color-text-primary);
      background: var(--color-page);
      max-width: 800px;
      margin: 0 auto;
      padding: var(--space-6);
      line-height: 1.6;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-6);
    }

    .back-link {
      color: var(--color-text-accent);
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .controls {
      display: flex;
      gap: var(--space-2);
      align-items: center;
    }

    .theme-toggle, .theme-select {
      font-family: inherit;
      font-size: 0.875rem;
      padding: var(--space-1_5) var(--space-3);
      border-radius: var(--radius-element);
      border: 1px solid var(--color-border);
      background: var(--color-card);
      color: var(--color-text-primary);
      cursor: pointer;
    }

    .theme-toggle:hover, .theme-select:hover {
      background: var(--color-muted);
    }

    h1 { margin-top: 0; }
    h2 { margin-top: var(--space-8); border-bottom: 1px solid var(--color-border); padding-bottom: var(--space-2); }
    h3 { margin-top: var(--space-6); }

    code {
      font-family: var(--font-code);
      background: var(--color-muted);
      padding: var(--space-0_5) var(--space-1);
      border-radius: var(--radius-element);
      font-size: 0.875em;
    }

    pre {
      background: var(--color-muted);
      padding: var(--space-4);
      border-radius: var(--radius-element);
      overflow-x: auto;
    }

    pre code {
      background: none;
      padding: 0;
    }

    .example {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-container);
      margin: var(--space-4) 0;
      overflow: hidden;
    }

    .example-preview {
      padding: var(--space-6);
      background: var(--color-card);
      display: flex;
      gap: var(--space-4);
      flex-wrap: wrap;
      align-items: center;
    }

    .example-code {
      border-top: 1px solid var(--color-border);
      margin: 0;
      border-radius: 0;
    }

    .error {
      color: var(--color-error-text);
      background: var(--color-error-bg);
      padding: var(--space-4);
      border-radius: var(--radius-element);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: var(--space-4) 0;
      font-size: 0.875rem;
    }

    th, td {
      padding: var(--space-2) var(--space-3);
      text-align: left;
      border-bottom: 1px solid var(--color-border-muted);
    }

    th {
      font-weight: 600;
      color: var(--color-text-secondary);
      border-bottom-color: var(--color-border);
    }

    tr:last-child td {
      border-bottom: none;
    }

    #content { display: none; }
    #content.loaded { display: block; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-link">&larr; Back to docs</a>
    <div class="controls">
      <select class="theme-select" id="theme-select"></select>
      <button class="theme-toggle" id="theme-toggle" title="Toggle dark mode">
        <span id="theme-icon">☀️</span>
      </button>
    </div>
  </header>

  <div id="content"></div>
  <div id="error" class="error" style="display: none;"></div>

  <script type="module">
    import Brownie from '../src/index.js';

    const params = new URLSearchParams(window.location.search);
    const component = params.get('component');

    if (!component) {
      showError('No component specified. Use ?component=brow-button');
    } else {
      loadComponent(component);
    }

    async function loadComponent(name) {
      try {
        const response = await fetch(`./components/${name}.md`);
        if (!response.ok) throw new Error(`Component "${name}" not found`);

        const markdown = await response.text();
        const html = renderMarkdown(markdown);

        document.getElementById('content').innerHTML = html;
        document.getElementById('content').classList.add('loaded');
        document.title = `${name} - Brownie`;

        await Brownie.ready();
      } catch (err) {
        showError(err.message);
      }
    }

    function showError(message) {
      document.getElementById('error').textContent = message;
      document.getElementById('error').style.display = 'block';
    }

    function renderMarkdown(md) {
      let html = md;

      // Code blocks with live examples
      html = html.replace(/```html example\n([\s\S]*?)```/g, (_, code) => {
        const escaped = code.trim().replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return `<div class="example">
          <div class="example-preview">${code.trim()}</div>
          <pre class="example-code"><code>${escaped}</code></pre>
        </div>`;
      });

      // Regular code blocks
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
        const escaped = code.trim().replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return `<pre><code>${escaped}</code></pre>`;
      });

      // Inline code
      html = html.replace(/`([^`]+)`/g, (_, code) => {
        const escaped = code.trim().replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return `<code>${escaped}</code>`;
      });

      // Headers
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

      // Tables
      html = html.replace(/^(\|.+\|)\n(\|[-:\| ]+\|)\n((?:\|.+\|\n?)+)/gm, (_, headerRow, separatorRow, bodyRows) => {
        const headers = headerRow.split('|').slice(1, -1).map(h => h.trim());
        const rows = bodyRows.trim().split('\n').map(row =>
          row.split('|').slice(1, -1).map(cell => cell.trim())
        );

        const thead = `<thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>`;
        const tbody = `<tbody>${rows.map(row =>
          `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`
        ).join('')}</tbody>`;

        return `<table>${thead}${tbody}</table>`;
      });

      // Paragraphs (simple approach)
      html = html.replace(/\n\n/g, '</p><p>');
      html = '<p>' + html + '</p>';
      html = html.replace(/<p><(h[1-3]|div|pre|table)/g, '<$1');
      html = html.replace(/<\/(h[1-3]|div|pre|table)><\/p>/g, '</$1>');
      html = html.replace(/<p><\/p>/g, '');

      return html;
    }

    // Theme switching
    const themeSelect = document.getElementById('theme-select');
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themeLink = document.getElementById('theme-link');

    async function loadThemes() {
      try {
        const response = await fetch('themes.json');
        const data = await response.json();

        themeSelect.innerHTML = data.themes.map(t =>
          `<option value="${t.path}">${t.name}</option>`
        ).join('');

        // Restore saved theme
        const savedTheme = localStorage.getItem('brownie-theme');
        if (savedTheme) {
          themeSelect.value = savedTheme;
          setTheme(savedTheme);
        }
      } catch (err) {
        console.error('Failed to load themes:', err);
      }
    }

    function setTheme(themePath) {
      themeLink.href = themePath;
    }

    themeSelect.addEventListener('change', (e) => {
      const value = /** @type {HTMLSelectElement} */ (e.target).value;
      setTheme(value);
      localStorage.setItem('brownie-theme', value);
    });

    // Dark mode toggle
    function updateDarkMode() {
      const isDark = document.documentElement.dataset.theme === 'dark';
      themeIcon.textContent = isDark ? '🌙' : '☀️';
    }

    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.dataset.theme === 'dark';
      document.documentElement.dataset.theme = isDark ? 'light' : 'dark';
      localStorage.setItem('brownie-dark-mode', isDark ? 'light' : 'dark');
      updateDarkMode();
    });

    // Restore dark mode preference
    const savedDarkMode = localStorage.getItem('brownie-dark-mode');
    if (savedDarkMode) {
      document.documentElement.dataset.theme = savedDarkMode;
    }
    updateDarkMode();

    // Load themes
    loadThemes();
  </script>
</body>
</html>
