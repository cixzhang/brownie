<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Component Docs - Brownie</title>
  <link rel="stylesheet" href="../src/base.css">
  <link rel="stylesheet" href="brownie.css" id="theme-link">
  <style>
    body {
      max-width: 800px;
      margin: 0 auto;
      padding: var(--space-6);
      line-height: 1.6;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-4);
    }

    .back-link {
      color: var(--color-text-accent);
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .controls {
      display: flex;
      gap: var(--space-2);
      align-items: center;
    }

    .theme-toggle, .theme-select {
      font-family: inherit;
      font-size: 0.875rem;
      padding: var(--space-1_5) var(--space-3);
      border-radius: var(--radius-element);
      border: 1px solid var(--color-border);
      background: var(--color-card);
      color: var(--color-text-primary);
      cursor: pointer;
    }

    .theme-toggle:hover, .theme-select:hover {
      background: var(--color-muted);
    }

    h1 { margin-top: 0; }
    h2 { margin-top: var(--space-6); border-bottom: 1px solid var(--color-border); }
    div { margin-bottom: var(--space-2); }

    code {
      background: var(--color-muted);
      padding: var(--space-0_5) var(--space-1);
      border-radius: var(--radius-element);
      font-size: 0.875em;
    }

    pre, pre code {
      background: none;
      padding: 0;
      margin: 0;
    }

    .example-code {
      overflow-x: auto;
      overscroll-behavior-inline: none;
    }

    .error {
      color: var(--color-error-text);
      background: var(--color-error-bg);
      padding: var(--space-4);
      border-radius: var(--radius-element);
    }

    brow-table {
      margin: var(--space-4) 0;
    }

    #content { display: none; }
    #content.loaded { display: block; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="back-link">&larr; Back to docs</a>
    <div class="controls">
      <select class="theme-select" id="theme-select"></select>
      <brow-button variant="ghost" id="theme-toggle" title="Toggle dark mode">
        <span id="theme-icon">☀️</span>
      </brow-button>
    </div>
  </header>

  <div id="content"></div>
  <div id="error" class="error" style="display: none;"></div>

  <script type="module">
    import Brownie from '../src/index.js';

    const params = new URLSearchParams(window.location.search);
    const component = params.get('component');

    if (!component) {
      showError('No component specified. Use ?component=brow-button');
    } else {
      initComponent(component);
    }

    async function initComponent(name) {
      try {
        // Check registry for redirects
        const registryResponse = await fetch('../src/registry.json');
        const registry = await registryResponse.json();
        const componentInfo = registry.components.find(c => c.name === name);

        if (componentInfo?.docs) {
          // Redirect to the parent component's docs
          window.location.replace(`?component=${componentInfo.docs}`);
          return;
        }

        loadComponent(name);
      } catch (err) {
        // If registry check fails, try loading directly
        loadComponent(name);
      }
    }

    async function loadComponent(name) {
      try {
        const response = await fetch(`./components/${name}.md`);
        if (!response.ok) throw new Error(`Component "${name}" not found`);

        const markdown = await response.text();
        const html = renderMarkdown(markdown);

        document.getElementById('content').innerHTML = html;
        document.getElementById('content').classList.add('loaded');
        document.title = `${name} - Brownie`;

        await Brownie.ready();
      } catch (err) {
        showError(err.message);
      }
    }

    function showError(message) {
      document.getElementById('error').textContent = message;
      document.getElementById('error').style.display = 'block';
    }

    function renderMarkdown(md) {
      let html = md;

      // Code blocks with live examples
      html = html.replace(/```html example\n([\s\S]*?)```/g, (_, code) => {
        const escaped = code.trim().replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return /*html*/`
          <brow-card padding="space-0">
            <brow-section padding="space-4">${code.trim()}</brow-section>
            <brow-section variant="muted" padding="space-4" class="example-code">
              <pre><code>${escaped}</code></pre>
            </brow-section>
          </brow-card>`;
      });

      // Regular code blocks
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
        const escaped = code.trim().replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return `<pre><code>${escaped}</code></pre>`;
      });

      // Tables - render as brow-table (before inline code so backticks are preserved)
      html = html.replace(/^(\|.+\|)\n(\|[-:\| ]+\|)\n((?:\|.+\|\n?)+)/gm, (_, headerRow, separatorRow, bodyRows) => {
        const headers = headerRow.split('|').slice(1, -1).map(h => h.trim());
        const rows = bodyRows.trim().split('\n').map(row =>
          row.split('|').slice(1, -1).map(cell => cell.trim())
        );

        // Convert header text to valid data attribute names
        const toDataAttr = (text) => (text || '').toLowerCase().replace(/\s+/g, '-');
        // Escape for HTML attribute (browser will decode when reading)
        const escapeAttr = (text) => text
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
        // Convert backticks to code tags for cell values
        const processCell = (text) => {
          // First escape content inside backticks, then wrap with code tags
          return text.replace(/`([^`]+)`/g, (_, code) => {
            const escaped = code
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/\{/g, '&#123;')
              .replace(/\}/g, '&#125;');
            return `<code>${escaped}</code>`;
          });
        };

        // Build header data attributes
        const headerAttrs = headers.map(h => `data-${toDataAttr(h)}="${escapeAttr(h)}"`).join(' ');

        // Build column templates with raw HTML rendering
        const columnsHtml = headers.map(h =>
          `<brow-table-column field="${toDataAttr(h)}">{{{${toDataAttr(h)}}}}</brow-table-column>`
        ).join('\n  ');

        // Build rows with data attributes (values have backticks converted to code tags)
        const rowsHtml = rows.map(row => {
          const rowAttrs = row
            .map((cell, i) => headers[i] ? `data-${toDataAttr(headers[i])}="${escapeAttr(processCell(cell))}"` : null)
            .filter(Boolean)
            .join(' ');
          return `<brow-table-row ${rowAttrs}></brow-table-row>`;
        }).join('\n  ');

        return `<brow-table>
  <brow-table-header ${headerAttrs}></brow-table-header>
  ${columnsHtml}
  ${rowsHtml}
</brow-table>`;
      });

      // Inline code
      html = html.replace(/`([^`]+)`/g, (_, code) => {
        const escaped = code.trim().replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return `<code>${escaped}</code>`;
      });

      // Headers
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

      // Paragraphs (simple approach)
      html = html.replace(/\n\n/g, '</div><div>');
      html = '<div>' + html + '</div>';
      html = html.replace(/<p><(h[1-3]|div|pre|table)/g, '<$1');
      html = html.replace(/<\/(h[1-3]|div|pre|table)><\/p>/g, '</$1>');
      html = html.replace(/<p><\/p>/g, '');

      return html;
    }

    // Theme switching
    const themeSelect = document.getElementById('theme-select');
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themeLink = document.getElementById('theme-link');

    async function loadThemes() {
      try {
        const response = await fetch('themes.json');
        const data = await response.json();

        themeSelect.innerHTML = data.themes.map(t =>
          `<option value="${t.path}">${t.name}</option>`
        ).join('');

        // Restore saved theme
        const savedTheme = localStorage.getItem('brownie-theme');
        if (savedTheme) {
          themeSelect.value = savedTheme;
          setTheme(savedTheme);
        }
      } catch (err) {
        console.error('Failed to load themes:', err);
      }
    }

    let hasInitializedTheme = false;
    function setTheme(themePath) {
      if (hasInitializedTheme) {
        Brownie.unready();
      }
      themeLink.href = themePath;
      themeLink.addEventListener('load', () => Brownie.ready(), { once: true });
      hasInitializedTheme = true;
    }

    themeSelect.addEventListener('change', (e) => {
      const value = /** @type {HTMLSelectElement} */ (e.target).value;
      setTheme(value);
      localStorage.setItem('brownie-theme', value);
    });

    // Dark mode toggle
    function updateDarkMode() {
      const isDark = document.documentElement.dataset.theme === 'dark';
      themeIcon.textContent = isDark ? '🌙' : '☀️';
    }

    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.dataset.theme === 'dark';
      document.documentElement.dataset.theme = isDark ? 'light' : 'dark';
      localStorage.setItem('brownie-dark-mode', isDark ? 'light' : 'dark');
      updateDarkMode();
    });

    // Restore dark mode preference
    const savedDarkMode = localStorage.getItem('brownie-dark-mode');
    if (savedDarkMode) {
      document.documentElement.dataset.theme = savedDarkMode;
    }
    updateDarkMode();

    // Load themes
    loadThemes();
  </script>
</body>
</html>
